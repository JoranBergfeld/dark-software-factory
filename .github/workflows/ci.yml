name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: dotnet

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json
      - name: Restore (locked)
        run: dotnet restore Dsf.sln --locked-mode
      - name: Build
        run: dotnet build Dsf.sln --no-restore --configuration Release
      - name: Parity acceptance gate
        run: >
          dotnet test tests/Dsf.Cli.Tests/Dsf.Cli.Tests.csproj
          --no-build
          --configuration Release
          --filter FullyQualifiedName~CutoverAcceptanceTests
      - name: Test
        run: dotnet test Dsf.sln --no-build --configuration Release
      - name: Module-reference boundary check
        run: dotnet test tests/Dsf.ModuleBoundaries.Tests --no-build --configuration Release
      - name: Dependency audit
        run: |
          set -euo pipefail
          output="$(dotnet list Dsf.sln package --vulnerable --include-transitive)"
          echo "$output"
          if grep -qi "has the following vulnerable packages" <<< "$output"; then
            echo "::error::Vulnerable NuGet packages detected." >&2
            exit 1
          fi
